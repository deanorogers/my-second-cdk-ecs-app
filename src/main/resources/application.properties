%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=80
transactions.base-url=${TRANSACTIONS_BASE_URL:http://localhost:8081}
quarkus.rest-client.transaction-data-api.url=${transactions.base-url}
# Maximum lifetime of connections in the direct Vert.x client pool, in milliseconds.
transactions.connection-ttl-ms=20000
quarkus.log.category."com.red".level=DEBUG
# Use the Vert.x/Netty DNS resolver and log outgoing queries and incoming replies.
# Cache hits do not send DNS queries. This applies to the shared Vert.x instance.
quarkus.vertx.use-async-dns=true
quarkus.log.category."io.netty.resolver.dns".min-level=DEBUG
quarkus.log.category."io.netty.resolver.dns".level=DEBUG
# quarkus.vertx.resolver.cache-max-time-to-live=5
