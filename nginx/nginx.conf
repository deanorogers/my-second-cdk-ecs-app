worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        location = / {
            add_header Content-Type text/plain;
            return 200 "nginx accounts service is running\n";
        }

        location = /accounts {
            add_header Content-Type application/json;
            return 200 '{"accounts":[{"id":"1001","name":"Checking","currency":"USD","balance":1532.44},{"id":"2001","name":"Savings","currency":"USD","balance":8099.12},{"id":"3001","name":"Emergency Fund","currency":"USD","balance":12500.00}]}' ;
        }
    }
}

